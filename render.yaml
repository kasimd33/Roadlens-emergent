# Render blueprint — deploy the RoadLens backend.
# In the Render dashboard: New → Blueprint → select this repo.
services:
  - type: web
    name: roadlens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false          # your Atlas connection string
      - key: GEMINI_API_KEY
        sync: false          # Google AI Studio key
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: CORS_ORIGINS
        sync: false          # your frontend URL, e.g. https://roadlens.vercel.app
      - key: ALLOW_DEMO_DATA
        value: "true"        # seed demo users + Ballari divisions; set false for real production
      - key: OPENAI_API_KEY
        sync: false          # Groq free-tier key (gsk_...) — fallback vision provider
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: PYTHON_VERSION
        value: 3.11.7
